
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  http-equiv="Content-Type"
  content="text/html; charset=UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>パスワード再設定</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background: #f5f6f8;

  color: #222;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.password-card {
  width: min(440px, 100%);

  padding: 34px;

  background: #fff;

  border: 1px solid #e4e7eb;

  border-radius: 12px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.07);
}

.brand {
  color: #555;

  font-size: 12px;

  font-weight: 600;
}

h1 {
  margin: 12px 0 0;

  font-size: 23px;

  line-height: 1.4;
}

.description {
  margin: 12px 0 28px;

  color: #707780;

  font-size: 13px;

  line-height: 1.8;
}

.field {
  display: block;

  margin-bottom: 18px;
}

.field span {
  display: block;

  margin-bottom: 7px;

  color: #555;

  font-size: 12px;

  font-weight: 600;
}

.field input {
  width: 100%;

  height: 44px;

  padding: 0 12px;

  border: 1px solid #d5d9de;

  border-radius: 7px;

  outline: none;

  font: inherit;
}

.field input:focus {
  border-color: #8d96a0;

  box-shadow:
    0 0 0 3px rgba(80,90,100,.08);
}

.password-help {
  margin: -8px 0 20px;

  color: #8a9098;

  font-size: 11px;

  line-height: 1.7;
}

.submit {
  width: 100%;

  height: 44px;

  border: 0;

  border-radius: 7px;

  background: #20252b;

  color: #fff;

  font: inherit;

  font-weight: 600;

  cursor: pointer;
}

.submit:disabled {
  opacity: .55;

  cursor: not-allowed;
}

.message {
  min-height: 20px;

  margin-top: 15px;

  font-size: 12px;

  line-height: 1.7;
}

.message.error {
  color: #a12c2c;
}

.message.success {
  color: #27713d;
}

</style>

</head>


<body>

<main class="password-card">

  <div class="brand">
    WEB-viewer
  </div>

  <h1>
    パスワード再設定
  </h1>

  <p class="description">
    管理者から発行された一時パスワードでログインしました。<br>
    安全のため、新しいパスワードを設定してください。
  </p>


  <label class="field">

    <span>
      新しいパスワード
    </span>

    <input
      id="newPassword"
      type="password"
      autocomplete="new-password"
      minlength="8"
      maxlength="128">

  </label>


  <label class="field">

    <span>
      新しいパスワード（確認）
    </span>

    <input
      id="confirmPassword"
      type="password"
      autocomplete="new-password"
      minlength="8"
      maxlength="128">

  </label>


  <p class="password-help">
    8文字以上128文字以内で入力してください。
  </p>


  <button
    id="submit"
    class="submit"
    type="button">

    パスワードを変更する

  </button>


  <div
    id="message"
    class="message"
    aria-live="polite">
  </div>

</main>


<script
  type="module"
  src="app.js?v=password-reset-20261114-1">
</script>

</body>
</html>
