<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">

<title>WEB-viewer</title>

<link
  rel="stylesheet"
  href="style.css">

</head>

<body>

<div class="viewer">

<header class="viewer-bar">

<div class="viewer-left">

<button
  id="close"
  class="toolbar-button">
戻る
</button>

<div
  id="title"
  class="viewer-title">
WEB-viewer
</div>

</div>


<div class="viewer-center">

<button
  id="previous"
  class="toolbar-button">
前へ
</button>

<div
  id="page"
  class="page-number">
-
</div>

<button
  id="next"
  class="toolbar-button">
次へ
</button>

</div>


<div class="viewer-right">

<button
  id="pen"
  class="toolbar-button pen-button">
ペン OFF
</button>

<button
  id="highlighter"
  class="toolbar-button">
蛍光ペン
</button>

<button
  id="eraser"
  class="toolbar-button">
消しゴム
</button>

<button
  id="clear"
  class="toolbar-button">
消去
</button>

</div>

</header>


<main
  id="viewerStage"
  class="viewer-stage">

<div
  id="pageContainer"
  class="page-container">

<canvas
  id="pdfCanvas">
</canvas>

<img
  id="imagePage"
  class="image-page"
  alt="">

<canvas
  id="annotationCanvas">
</canvas>

</div>

</main>

</div>


<script
  type="module"
  src="app.js?v=viewer-5">
</script>

</body>

</html>
