
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>WEB-viewer</title>

<link
  rel="stylesheet"
  href="style.css">

</head>

<body>

<div class="viewer">

  <!-- =====================================================
       Toolbar
       ===================================================== -->

  <header class="viewer-toolbar">

    <div class="toolbar-brand">

      <button
        id="close"
        class="tool-button icon-button"
        type="button"
        aria-label="戻る">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18 9 12l6-6"/>
        </svg>

      </button>


      <div class="book-title-wrap">

        <div class="viewer-brand">
          WEB-viewer
        </div>

        <div
          id="title"
          class="book-title">
          読み込み中
        </div>

      </div>

    </div>


    <!-- Page navigation -->

    <div class="page-navigation">

      <button
        id="first"
        class="tool-button icon-button"
        type="button"
        aria-label="最初のページ">

        <svg viewBox="0 0 24 24">
          <path d="M18 6 12 12l6 6"/>
          <path d="M12 6 6 12l6 6"/>
        </svg>

      </button>


      <button
        id="previous"
        class="tool-button icon-button"
        type="button"
        aria-label="前のページ">

        <svg viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6"/>
        </svg>

      </button>


      <div
        id="page"
        class="page-counter">
        - / -
      </div>


      <button
        id="next"
        class="tool-button icon-button"
        type="button"
        aria-label="次のページ">

        <svg viewBox="0 0 24 24">
          <path d="m9 18 6-6-6-6"/>
        </svg>

      </button>


      <button
        id="last"
        class="tool-button icon-button"
        type="button"
        aria-label="最後のページ">

        <svg viewBox="0 0 24 24">
          <path d="m6 6 6 6-6 6"/>
          <path d="m12 6 6 6-6 6"/>
        </svg>

      </button>

    </div>


    <!-- Main tools -->

    <div class="toolbar-tools">

      <button
        id="move"
        class="tool-button tool-with-label active"
        type="button">

        <svg viewBox="0 0 24 24">
          <path d="M12 3v18"/>
          <path d="m8 7 4-4 4 4"/>
          <path d="m8 17 4 4 4-4"/>
          <path d="M3 12h18"/>
          <path d="m7 8-4 4 4 4"/>
          <path d="m17 8 4 4-4 4"/>
        </svg>

        <span>移動</span>

      </button>


      <button
        id="pen"
        class="tool-button tool-with-label"
        type="button">

        <svg viewBox="0 0 24 24">
          <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/>
          <path d="m14 7 3 3"/>
        </svg>

        <span>ペン OFF</span>

      </button>


      <button
        id="eraser"
        class="tool-button tool-with-label"
        type="button">

        <svg viewBox="0 0 24 24">
          <path d="m4 15 8-8 7 7-8 8H7l-3-3a2.8 2.8 0 0 1 0-4Z"/>
          <path d="m13 18 5 0"/>
        </svg>

        <span>消しゴム</span>

      </button>


      <div class="tool-divider"></div>


      <button
        id="zoomOut"
        class="tool-button icon-button"
        type="button"
        aria-label="縮小">

        <svg viewBox="0 0 24 24">
          <path d="M5 12h14"/>
        </svg>

      </button>


      <button
        id="zoomIn"
        class="tool-button icon-button"
        type="button"
        aria-label="拡大">

        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6"/>
          <path d="M20 20l-4.5-4.5"/>
          <path d="M11 8v6"/>
          <path d="M8 11h6"/>
        </svg>

      </button>


      <button
        id="fitWidth"
        class="tool-button tool-with-label"
        type="button">

        <svg viewBox="0 0 24 24">
          <path d="M4 8V5a1 1 0 0 1 1-1h3"/>
          <path d="M20 8V5a1 1 0 0 0-1-1h-3"/>
          <path d="M4 16v3a1 1 0 0 0 1 1h3"/>
          <path d="M20 16v3a1 1 0 0 1-1 1h-3"/>
          <path d="M8 12h8"/>
        </svg>

        <span>横幅</span>

      </button>


      <button
        id="fitHeight"
        class="tool-button tool-with-label"
        type="button">

        <svg viewBox="0 0 24 24">
          <path d="M8 4H5a1 1 0 0 0-1 1v3"/>
          <path d="M16 4h3a1 1 0 0 1 1 1v3"/>
          <path d="M8 20H5a1 1 0 0 1-1-1v-3"/>
          <path d="M16 20h3a1 1 0 0 0 1-1v-3"/>
          <path d="M12 8v8"/>
        </svg>

        <span>縦幅</span>

      </button>


      <div class="tool-divider"></div>


      <button
        id="print"
        class="tool-button tool-with-label"
        type="button">

        <svg viewBox="0 0 24 24">
          <path d="M6 9V4h12v5"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <path d="M6 14h12v6H6z"/>
        </svg>

        <span>印刷</span>

      </button>


      <button
        id="fullscreen"
        class="tool-button tool-with-label"
        type="button">

        <svg viewBox="0 0 24 24">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>

        <span>全画面</span>

      </button>


      <button
        id="favorite"
        class="tool-button icon-button"
        type="button"
        aria-label="お気に入り">

        <svg viewBox="0 0 24 24">
          <path d="m12 4 2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8L12 4Z"/>
        </svg>

      </button>

    </div>


    <button
      id="menuButton"
      class="menu-button"
      type="button"
      aria-label="メニュー"
      aria-expanded="false">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </header>


  <!-- =====================================================
       Mobile menu
       ===================================================== -->

  <nav
    id="mobileMenu"
    class="mobile-menu"
    aria-hidden="true">

    <button data-action="first">
      最初のページ
    </button>

    <button data-action="previous">
      前のページ
    </button>

    <button data-action="next">
      次のページ
    </button>

    <button data-action="last">
      最後のページ
    </button>

    <div class="mobile-menu-divider"></div>

    <button data-action="move">
      移動
    </button>

    <button data-action="pen">
      ペン
    </button>

    <button data-action="eraser">
      消しゴム
    </button>

    <button data-action="zoomOut">
      縮小
    </button>

    <button data-action="zoomIn">
      拡大
    </button>

    <button data-action="fitWidth">
      横幅に合わせる
    </button>

    <button data-action="fitHeight">
      縦幅に合わせる
    </button>

    <button data-action="print">
      印刷
    </button>

    <button data-action="fullscreen">
      全画面
    </button>

  </nav>


  <!-- =====================================================
       Viewer
       ===================================================== -->

  <main
    id="stage"
    class="viewer-stage">

    <div
      class="slide-viewport">

      <div
        id="currentSlide"
        class="page-slide current-slide">

        <canvas
          id="currentPdfCanvas">
        </canvas>

        <img
          id="currentImage"
          alt=""
          draggable="false">

        <canvas
          id="currentAnnotation"
          class="annotation-canvas">
        </canvas>

      </div>


      <div
        id="incomingSlide"
        class="page-slide incoming-slide">

        <canvas
          id="incomingPdfCanvas">
        </canvas>

        <img
          id="incomingImage"
          alt=""
          draggable="false">

      </div>

    </div>

  </main>


  <!-- =====================================================
       Loading
       ===================================================== -->

  <div
    id="loadingOverlay"
    class="loading-overlay hidden"
    aria-hidden="true">

    <div
      class="loading-spinner">

      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>

  </div>


  <div
    id="viewerMessage"
    class="viewer-message hidden">
  </div>

</div>


<script
  type="module"
  src="app.js?v=viewer-hq-20261113">
</script>

</body>
</html>
