
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>WEB-viewer</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

<link
  rel="stylesheet"
  href="style.css">

</head>

<body>

<div class="viewer">


<header class="viewer-toolbar">


  <div class="viewer-left">

    <button
      id="close"
      type="button"
      class="toolbar-button">

      戻る

    </button>


    <strong
      id="title">
      読み込み中
    </strong>

  </div>


  <div class="viewer-page-controls">

    <button
      id="first"
      type="button"
      class="toolbar-button">

      最初

    </button>


    <button
      id="previous"
      type="button"
      class="toolbar-button">

      前

    </button>


    <span id="page">
      -
    </span>


    <button
      id="next"
      type="button"
      class="toolbar-button">

      次

    </button>


    <button
      id="last"
      type="button"
      class="toolbar-button">

      最後

    </button>

  </div>


  <div class="viewer-tools">

    <button
      id="move"
      type="button"
      class="toolbar-button active">

      移動

    </button>


    <button
      id="pen"
      type="button"
      class="toolbar-button">

      ペン OFF

    </button>


    <button
      id="eraser"
      type="button"
      class="toolbar-button">

      消しゴム

    </button>


    <button
      id="favorite"
      type="button"
      class="toolbar-button">

      お気に入り

    </button>


    <button
      id="zoomOut"
      type="button"
      class="toolbar-button">

      −

    </button>


    <button
      id="zoomIn"
      type="button"
      class="toolbar-button">

      ＋

    </button>


    <button
      id="fitWidth"
      type="button"
      class="toolbar-button">

      横幅

    </button>


    <button
      id="fitHeight"
      type="button"
      class="toolbar-button">

      縦幅

    </button>


    <button
      id="fullscreen"
      type="button"
      class="toolbar-button">

      全画面

    </button>

  </div>


  <button
    id="menuButton"
    type="button"
    class="menu-button"
    aria-label="メニュー"
    aria-expanded="false">

    <span></span>
    <span></span>
    <span></span>

  </button>


</header>


<nav
  id="mobileMenu"
  class="mobile-menu"
  aria-hidden="true">

  <button data-action="first">
    最初のページ
  </button>

  <button data-action="previous">
    前のページ
  </button>

  <button data-action="next">
    次のページ
  </button>

  <button data-action="last">
    最後のページ
  </button>

  <button data-action="move">
    移動モード
  </button>

  <button data-action="pen">
    ペン
  </button>

  <button data-action="eraser">
    消しゴム
  </button>

  <button data-action="favorite">
    お気に入り
  </button>

  <button data-action="zoomOut">
    縮小
  </button>

  <button data-action="zoomIn">
    拡大
  </button>

  <button data-action="fitWidth">
    横幅に合わせる
  </button>

  <button data-action="fitHeight">
    縦幅に合わせる
  </button>

  <button data-action="fullscreen">
    全画面
  </button>

</nav>


<main
  id="stage"
  class="viewer-stage">


  <div
    id="pageContainer"
    class="page-container">


    <!-- PDF -->

    <canvas
      id="pdfCanvas">
    </canvas>


    <!-- 画像Book -->

    <img
      id="imagePage"
      alt=""
      draggable="false">


    <!-- 書き込み -->

    <canvas
      id="annotationCanvas">
    </canvas>


  </div>


</main>


<div
  id="viewerMessage"
  class="viewer-message hidden">
</div>


</div>


<script
  type="module"
  src="app.js?v=viewer-pdf-image-final">
</script>

</body>

</html>
