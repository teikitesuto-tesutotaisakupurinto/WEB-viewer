<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>My Books</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

<link
  rel="stylesheet"
  href="style.css">

</head>

<body>

<aside class="student-side">

<div class="student-brand">

<div class="brand-title">
WEB-viewer
</div>

<div class="brand-subtitle">
教材閲覧システム
</div>

</div>


<nav>

<a
  class="active"
  href="../books/">
My Books
</a>

<a
  href="../materials/">
資料
</a>

<button
  id="logout"
  type="button">
ログアウト
</button>

</nav>

</aside>


<main class="student-main">

<header class="student-notice">

<div class="notice-title">
お知らせ
</div>

<div>
WEB-viewerをご利用いただけます。
</div>

</header>


<section class="student-content">


<div class="content-heading">

<div>

<h1>
My Books
</h1>

<p>
利用できる教材
</p>

</div>

<div
  id="studentName">
</div>

</div>


<!-- =========================
     シリアル登録
     ========================= -->

<section class="register-card">

<div>

<h2>
教材を登録
</h2>

<p>
発行されたシリアルコードを入力してください。
</p>

</div>


<div class="register-form">

<input
  id="serialCode"
  type="text"
  autocomplete="off"
  autocapitalize="characters"
  spellcheck="false"
  placeholder="XXXX-XXXX-XXXX">


<button
  id="register"
  type="button"
  class="register-button">

登録

</button>

</div>


<p
  id="registerMessage"
  class="register-message">
</p>

</section>


<!-- =========================
     Book
     ========================= -->

<section
  id="books"
  class="book-grid">

<div class="book-empty">
読み込み中です。
</div>

</section>


</section>

</main>


<script
  type="module"
  src="app.js?v=serial-register-final">
</script>

</body>

</html>
