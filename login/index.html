
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>WEB-viewer</title>

<link
  rel="stylesheet"
  href="style.css?v=login-final-1">

</head>


<body>

<main class="login-page">

  <section class="login-card">

    <h1>
      WEB-viewer
    </h1>

    <p class="login-subtitle">
      教材閲覧システム
    </p>


    <form
      id="loginForm"
      novalidate>


      <label>

        メールアドレス

        <input
          id="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          required>

      </label>


      <label>

        パスワード

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required>

      </label>


      <button
        id="loginButton"
        class="login-button"
        type="submit">

        ログイン

      </button>


      <p
        id="message"
        class="login-message"
        aria-live="polite">
      </p>


    </form>

  </section>

</main>


<script
  type="module"
  src="app.js?v=login-final-20261114-1">
</script>

</body>
</html>
