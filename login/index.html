<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>WEB-viewer ログイン</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <h1>WEB-viewer</h1>

      <form id="loginForm">

        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required>

        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required>

        <button
          id="loginButton"
          type="submit">
          ログイン
        </button>

        <p id="message"></p>

      </form>

      <p
        id="version"
        class="version">
        WEB-viewer
      </p>

    </section>

  </main>


  <script
    type="module"
    src="app.js?v=20261109-02">
  </script>

</body>

</html>
