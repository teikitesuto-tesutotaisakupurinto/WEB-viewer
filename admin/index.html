
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>WEB-viewer 管理</title>

<link
  rel="stylesheet"
  href="../assets/css/common.css">

<link
  rel="stylesheet"
  href="style.css">

</head>

<body>

<aside class="admin-side">

<div class="admin-brand">

<div>
WEB-viewer
</div>

<small>
管理システム
</small>

</div>


<nav>

<a
  class="active"
  href="./">
ダッシュボード
</a>

<a href="books/">
Book管理
</a>

<a href="serials/">
シリアル管理
</a>

<a href="students/">
生徒管理
</a>

<a href="materials/">
資料配信
</a>

<a href="b4/">
B4資料
</a>

<a href="system/">
システム管理
</a>

<button
  id="logout"
  type="button">
ログアウト
</button>

</nav>

</aside>


<main class="admin-main">


<!-- =====================================================
     通常のお知らせ
     ===================================================== -->

<header class="admin-notice">

<div>
お知らせ
</div>

<span>
WEB-viewer管理画面
</span>

</header>


<!-- =====================================================
     メンテナンス表示
     通常Adminは利用可能
     ===================================================== -->

<div
  id="maintenanceBanner"
  class="maintenance-banner hidden">

<div class="maintenance-banner-icon">

<svg
  viewBox="0 0 24 24"
  aria-hidden="true">

<path
  d="M14.7 6.3a5 5 0 0 0-6.36 6.36L3.5 17.5a1.75 1.75 0 1 0 2.47 2.47l4.84-4.84A5 5 0 0 0 17.7 8.77l-3.18 3.18a2.5 2.5 0 1 1-3.54-3.54l3.18-3.18a5 5 0 0 0-1.46-.93Z">
</path>

</svg>

</div>


<div class="maintenance-banner-content">

<strong>
メンテナンス中
</strong>

<span id="maintenanceBannerMessage">
現在システムはメンテナンス中です。
</span>

</div>


<a
  href="system/"
  class="maintenance-banner-link">

設定を開く

</a>

</div>


<!-- =====================================================
     Content
     ===================================================== -->

<section class="admin-content">


<div class="page-heading">

<div>

<h1>
ダッシュボード
</h1>

<p>
WEB-viewerの管理状況
</p>

</div>

</div>


<div class="admin-stats">

<div class="admin-stat">

<span>
Book
</span>

<strong
  id="bookCount">
-
</strong>

</div>


<div class="admin-stat">

<span>
生徒
</span>

<strong
  id="studentCount">
-
</strong>

</div>


<div class="admin-stat">

<span>
シリアル
</span>

<strong
  id="licenseCount">
-
</strong>

</div>

</div>


<section class="admin-card">

<h2>
管理メニュー
</h2>

<p>
左側のメニューから管理項目を選択してください。
</p>

</section>


<div
  id="dashboardError">
</div>


</section>

</main>


<script
  type="module"
  src="app.js?v=maintenance-admin">
</script>

</body>

</html>
