<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>シリアル管理</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

<style>

.student-select-list {
  max-height: 420px;
  overflow-y: auto;

  margin-top: 10px;

  border: 1px solid #ddd;
  border-radius: 8px;
}

.student-select-item {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 12px;

  border-bottom: 1px solid #eee;
}

.student-select-item:last-child {
  border-bottom: 0;
}

.student-select-item input {
  width: auto;
  margin: 0;
}

.select-all-row {
  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 10px;
}

.select-all-row input {
  width: auto;
  margin: 0;
}

</style>

</head>

<body>

<header class="topbar">

<button
  class="menu-button"
  onclick="location.href='../'">
戻る
</button>

<div class="logo">
シリアル管理
</div>

</header>


<main class="page">

<h1>
シリアル管理
</h1>


<section class="card">

<h2>
一括発行
</h2>


<label>
Book

<select id="book">
</select>

</label>


<div class="select-all-row">

<input
  id="selectAll"
  type="checkbox">

<label
  for="selectAll">
全Studentを選択
</label>

</div>


<div
  id="students"
  class="student-select-list">
</div>


<div
  class="toolbar"
  style="margin-top:15px">

<button
  id="issue"
  class="primary-button">

一括発行

</button>

</div>


<p id="message"></p>

</section>


<section
  class="card"
  style="margin-top:20px">

<h2>
発行済みシリアル
</h2>


<div
  id="serials">
</div>

</section>

</main>


<script
  type="module"
  src="app.js">
</script>

</body>

</html>
