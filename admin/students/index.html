
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  http-equiv="Content-Type"
  content="text/html; charset=UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>生徒管理</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css?v=students-final-1">

<link
  rel="stylesheet"
  href="../style.css?v=students-final-1">

</head>


<body>

<aside class="admin-side">

  <div class="admin-brand">

    <div>
      WEB-viewer
    </div>

    <small>
      管理システム
    </small>

  </div>


  <nav>

    <a href="../">
      ダッシュボード
    </a>

    <a href="../books/">
      Book管理
    </a>

    <a href="../serials/">
      シリアル管理
    </a>

    <a
      class="active"
      href="./">

      生徒管理

    </a>

    <a href="../materials/">
      資料配信
    </a>

    <a href="../b4/">
      B4資料
    </a>

    <a href="../system/">
      システム管理
    </a>

    <button
      id="logout"
      type="button">

      ログアウト

    </button>

  </nav>

</aside>


<main class="admin-main">

  <header class="admin-notice">

    <div>
      お知らせ
    </div>

    <span>
      生徒管理
    </span>

  </header>


  <section class="admin-content">


    <!-- =================================================
         Heading
         ================================================= -->

    <div class="page-heading">

      <div>

        <h1>
          生徒管理
        </h1>

        <p>
          生徒の登録と管理
        </p>

      </div>


      <div class="page-heading-actions">

        <button
          id="exportCsv"
          type="button"
          class="secondary-button">

          CSV出力

        </button>


        <button
          id="showForm"
          type="button"
          class="primary-button">

          生徒を追加

        </button>

      </div>

    </div>


    <!-- =================================================
         Search
         ================================================= -->

    <section class="admin-card student-search-card">

      <div class="student-search">

        <input
          id="studentSearch"
          type="search"
          autocomplete="off"
          placeholder="氏名・生徒番号・メールアドレスで検索">

        <button
          id="clearSearch"
          type="button"
          class="secondary-button">

          クリア

        </button>

      </div>


      <div
        id="studentCount"
        class="student-count">

        -

      </div>

    </section>


    <!-- =================================================
         Create
         ================================================= -->

    <section
      id="formCard"
      class="admin-card hidden">

      <h2>
        生徒を追加
      </h2>


      <div class="form-grid">


        <label>

          <span>
            氏名
          </span>

          <input
            id="displayName"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="生徒氏名">

        </label>


        <label>

          <span>
            生徒番号
          </span>

          <input
            id="studentNumber"
            type="text"
            autocomplete="off"
            maxlength="50"
            placeholder="生徒番号">

        </label>


        <label>

          <span>
            メールアドレス
          </span>

          <input
            id="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="student@example.com">

        </label>


        <label>

          <span>
            学年
          </span>

          <input
            id="grade"
            type="text"
            maxlength="30"
            placeholder="例：中2">

        </label>


        <label>

          <span>
            クラス
          </span>

          <input
            id="className"
            type="text"
            maxlength="50"
            placeholder="例：A">

        </label>


        <label>

          <span>
            初期パスワード
          </span>

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            placeholder="8文字以上">

        </label>


      </div>


      <div class="toolbar">

        <button
          id="create"
          type="button"
          class="primary-button">

          登録

        </button>


        <button
          id="cancel"
          type="button"
          class="secondary-button">

          キャンセル

        </button>

      </div>


      <p
        id="message"
        class="message"
        aria-live="polite">
      </p>

    </section>


    <!-- =================================================
         List
         ================================================= -->

    <section class="admin-card">

      <div class="card-heading">

        <div>

          <h2>
            登録済み生徒
          </h2>

          <p class="card-description">
            生徒を選択すると詳細を表示できます。
          </p>

        </div>

      </div>


      <div
        id="students"
        class="student-list"
        aria-live="polite"
        aria-busy="false">

        <div class="list-row">
          生徒を読み込んでいます。
        </div>

      </div>

    </section>

  </section>

</main>


<script type="module">

try {

  await import(
    "./app.js?v=students-final-20261114-1"
  );

}
catch (error) {

  console.error(
    "STUDENT ADMIN APP ERROR:",
    error
  );


  const element =
    document.getElementById(
      "students"
    );


  if (element) {

    element.innerHTML = `

      <div class="list-row">

        <strong>
          生徒管理を読み込めませんでした。
        </strong>

        <br><br>

        <small>
          ${String(
            error?.message ||
            error
          )
            .replace(
              /&/g,
              "&amp;"
            )
            .replace(
              /</g,
              "&lt;"
            )
            .replace(
              />/g,
              "&gt;"
            )}
        </small>

      </div>

    `;

  }

}

</script>

</body>
</html>
