<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Student管理</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

</head>

<body>

<header class="topbar">

<button
  class="menu-button"
  onclick="location.href='../'">
戻る
</button>

<div class="logo">
Student管理
</div>

</header>


<main class="page">

<div
  class="page-header"
  style="
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
  ">

<div>

<h1>
Student管理
</h1>

</div>

<button
  id="showForm"
  class="primary-button">
Studentを追加
</button>

</div>


<section
  id="formCard"
  class="card hidden">

<h2>
Studentを追加
</h2>


<label>
氏名

<input
  id="displayName"
  type="text"
  autocomplete="name">
</label>


<label>
メールアドレス

<input
  id="email"
  type="email"
  autocomplete="email">
</label>


<label>
初期パスワード

<input
  id="password"
  type="password"
  autocomplete="new-password">
</label>


<label>
クラス

<input
  id="className"
  type="text">
</label>


<label>
学籍番号

<input
  id="studentNumber"
  type="text">
</label>


<div class="toolbar">

<button
  id="create"
  class="primary-button">
登録
</button>

<button
  id="cancel"
  class="secondary-button">
キャンセル
</button>

</div>


<p id="message"></p>

</section>


<section
  class="card"
  style="margin-top:20px">

<h2>
Student一覧
</h2>

<div
  id="students">
</div>

</section>

</main>


<script
  type="module"
  src="app.js">
</script>

</body>

</html>
