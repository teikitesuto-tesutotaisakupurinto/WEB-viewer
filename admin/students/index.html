
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>生徒管理</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

<link
  rel="stylesheet"
  href="../style.css">

</head>


<body>

<aside class="admin-side">

  <div class="admin-brand">

    <div>
      WEB-viewer
    </div>

    <small>
      管理システム
    </small>

  </div>


  <nav>

    <a href="../">
      ダッシュボード
    </a>

    <a href="../books/">
      Book管理
    </a>

    <a href="../serials/">
      シリアル管理
    </a>

    <a
      class="active"
      href="./">

      生徒管理

    </a>

    <a href="../materials/">
      資料配信
    </a>

    <a href="../b4/">
      B4資料
    </a>

    <a href="../system/">
      システム管理
    </a>

    <button
      id="logout"
      type="button">

      ログアウト

    </button>

  </nav>

</aside>


<main class="admin-main">

  <header class="admin-notice">

    <div>
      お知らせ
    </div>

    <span>
      生徒管理
    </span>

  </header>


  <section class="admin-content">


    <!-- ===================================================
         Heading
         =================================================== -->

    <div class="page-heading">

      <div>

        <h1>
          生徒管理
        </h1>

        <p>
          生徒の登録と管理
        </p>

      </div>


      <button
        id="showForm"
        type="button"
        class="primary-button">

        生徒を追加

      </button>

    </div>


    <!-- ===================================================
         Create student
         =================================================== -->

    <section
      id="formCard"
      class="admin-card hidden">

      <h2>
        生徒を追加
      </h2>


      <div class="form-grid">


        <label>

          <span>
            氏名
          </span>

          <input
            id="displayName"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="生徒氏名">

        </label>


        <label>

          <span>
            メールアドレス
          </span>

          <input
            id="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="student@example.com">

        </label>


        <label>

          <span>
            初期パスワード
          </span>

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            placeholder="8文字以上">

        </label>


      </div>


      <div class="toolbar">

        <button
          id="create"
          type="button"
          class="primary-button">

          登録

        </button>


        <button
          id="cancel"
          type="button"
          class="secondary-button">

          キャンセル

        </button>

      </div>


      <p
        id="message"
        class="message"
        aria-live="polite">
      </p>

    </section>


    <!-- ===================================================
         Student list
         =================================================== -->

    <section class="admin-card">

      <div class="card-heading">

        <div>

          <h2>
            登録済み生徒
          </h2>

          <p class="card-description">
            現在登録されている生徒を表示します。
          </p>

        </div>

      </div>


      <div
        id="students"
        class="student-list">

        <div class="list-row">

          生徒を読み込んでいます。

        </div>

      </div>

    </section>

  </section>

</main>


<script
  type="module"
  src="app.js?v=admin-students-20261113">

</script>

</body>

</html>
