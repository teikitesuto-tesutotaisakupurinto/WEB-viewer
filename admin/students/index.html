
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>生徒管理</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

<link
  rel="stylesheet"
  href="../style.css">

</head>

<body>

<aside class="admin-side">

<div class="admin-brand">

<div>WEB-viewer</div>

<small>管理システム</small>

</div>


<nav>

<a href="../">
ダッシュボード
</a>

<a href="../books/">
Book管理
</a>

<a href="../serials/">
シリアル管理
</a>

<a
  class="active"
  href="./">
生徒管理
</a>

<a href="../materials/">
資料配信
</a>

<a href="../b4/">
B4資料
</a>

<a href="../system/">
システム管理
</a>

<button
  id="logout"
  type="button">
ログアウト
</button>

</nav>

</aside>


<main class="admin-main">

<header class="admin-notice">

<div>お知らせ</div>

<span>生徒管理</span>

</header>


<section class="admin-content">

<div class="page-heading">

<div>

<h1>
生徒管理
</h1>

<p>
生徒の登録と管理
</p>

</div>


<button
  id="showForm"
  type="button"
  class="primary-button">

生徒を追加

</button>

</div>


<section
  id="formCard"
  class="admin-card hidden">

<h2>
生徒を追加
</h2>


<label>

氏名

<input
  id="displayName"
  type="text"
  autocomplete="name">

</label>


<label>

メールアドレス

<input
  id="email"
  type="email"
  autocomplete="email">

</label>


<label>

初期パスワード

<input
  id="password"
  type="password"
  autocomplete="new-password">

</label>


<div class="toolbar">

<button
  id="create"
  type="button"
  class="primary-button">

登録

</button>


<button
  id="cancel"
  type="button"
  class="secondary-button">

キャンセル

</button>

</div>


<p
  id="message"
  class="message">
</p>

</section>


<section class="admin-card">

<h2>
登録済み生徒
</h2>


<div
  id="students"
  class="student-list">

<div class="list-row">
読み込んでいます。
</div>

</div>

</section>

</section>

</main>


<script
  type="module"
  src="app.js?v=admin-students-final">
</script>

</body>

</html>
