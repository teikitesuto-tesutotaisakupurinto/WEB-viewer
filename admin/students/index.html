
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  http-equiv="Content-Type"
  content="text/html; charset=UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<meta
  http-equiv="X-UA-Compatible"
  content="IE=edge">

<title>生徒管理</title>


<link
  rel="stylesheet"
  href="../../assets/css/common.css?v=admin-students-utf8-1">


<link
  rel="stylesheet"
  href="../style.css?v=admin-students-utf8-1">

</head>


<body>


<!-- =======================================================
     Sidebar
     ======================================================= -->

<aside class="admin-side">

  <div class="admin-brand">

    <div>
      WEB-viewer
    </div>

    <small>
      管理システム
    </small>

  </div>


  <nav>

    <a href="../">
      ダッシュボード
    </a>


    <a href="../books/">
      Book管理
    </a>


    <a href="../serials/">
      シリアル管理
    </a>


    <a
      class="active"
      href="./">

      生徒管理

    </a>


    <a href="../materials/">
      資料配信
    </a>


    <a href="../b4/">
      B4資料
    </a>


    <a href="../system/">
      システム管理
    </a>


    <button
      id="logout"
      type="button">

      ログアウト

    </button>

  </nav>

</aside>


<!-- =======================================================
     Main
     ======================================================= -->

<main class="admin-main">


  <!-- =====================================================
       Notice
       ===================================================== -->

  <header class="admin-notice">

    <div>
      お知らせ
    </div>

    <span>
      生徒管理
    </span>

  </header>


  <!-- =====================================================
       Content
       ===================================================== -->

  <section class="admin-content">


    <!-- ===================================================
         Heading
         =================================================== -->

    <div class="page-heading">

      <div>

        <h1>
          生徒管理
        </h1>

        <p>
          生徒の登録と管理
        </p>

      </div>


      <button
        id="showForm"
        type="button"
        class="primary-button">

        生徒を追加

      </button>

    </div>


    <!-- ===================================================
         Student form
         =================================================== -->

    <section
      id="formCard"
      class="admin-card hidden">


      <h2>
        生徒を追加
      </h2>


      <div class="form-grid">


        <label>

          <span>
            氏名
          </span>

          <input
            id="displayName"
            name="displayName"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="生徒氏名">

        </label>


        <label>

          <span>
            メールアドレス
          </span>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="student@example.com">

        </label>


        <label>

          <span>
            初期パスワード
          </span>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            placeholder="8文字以上">

        </label>


      </div>


      <div class="toolbar">


        <button
          id="create"
          type="button"
          class="primary-button">

          登録

        </button>


        <button
          id="cancel"
          type="button"
          class="secondary-button">

          キャンセル

        </button>


      </div>


      <p
        id="message"
        class="message"
        aria-live="polite">
      </p>


    </section>


    <!-- ===================================================
         Student list
         =================================================== -->

    <section class="admin-card">


      <div class="card-heading">

        <div>

          <h2>
            登録済み生徒
          </h2>

          <p class="card-description">
            現在登録されている生徒を表示します。
          </p>

        </div>

      </div>


      <div
        id="students"
        class="student-list"
        aria-live="polite"
        aria-busy="true">


        <div class="list-row">

          生徒を読み込んでいます。

        </div>


      </div>


    </section>


  </section>


</main>


<!-- =======================================================
     App
     ======================================================= -->

<script type="module">

  const students =
    document.getElementById(
      "students"
    );


  /*
   * app.js自体の読み込みエラーを
   * 画面に表示する。
   */

  try {

    await import(
      "./app.js?v=admin-students-debug-20261114-1"
    );


  }
  catch (error) {

    console.error(
      "ADMIN STUDENTS APP LOAD ERROR:",
      error
    );


    if (students) {

      students.setAttribute(
        "aria-busy",
        "false"
      );


      const safeMessage =
        String(
          error?.message ||
          error ||
          "JavaScriptの読み込みに失敗しました。"
        )
          .replace(
            /&/g,
            "&amp;"
          )
          .replace(
            /</g,
            "&lt;"
          )
          .replace(
            />/g,
            "&gt;"
          )
          .replace(
            /"/g,
            "&quot;"
          );


      students.innerHTML = `

        <div class="list-row">

          <strong>
            生徒管理を読み込めませんでした。
          </strong>

          <br><br>

          <small>
            ${safeMessage}
          </small>

          <br><br>

          <button
            type="button"
            class="secondary-button"
            onclick="location.reload()">

            再読み込み

          </button>

        </div>

      `;

    }

  }

</script>


</body>
</html>
