
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  http-equiv="Content-Type"
  content="text/html; charset=UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>生徒管理</title>


<link
  rel="stylesheet"
  href="../../assets/css/common.css?v=students-common-20261114-1">


<link
  rel="stylesheet"
  href="../style.css?v=students-admin-20261114-1">


<link
  rel="stylesheet"
  href="style.css?v=students-detail-20261114-3">


</head>


<body>


<!-- =====================================================
     Sidebar
     ===================================================== -->

<aside class="admin-side">

  <div class="admin-brand">

    <div>
      WEB-viewer
    </div>

    <small>
      管理システム
    </small>

  </div>


  <nav>

    <a href="../">
      ダッシュボード
    </a>


    <a href="../books/">
      Book管理
    </a>


    <a href="../serials/">
      シリアル管理
    </a>


    <a
      class="active"
      href="./">

      生徒管理

    </a>


    <a href="../materials/">
      資料配信
    </a>


    <a href="../b4/">
      B4資料
    </a>


    <a href="../system/">
      システム管理
    </a>


    <button
      id="logout"
      type="button">

      ログアウト

    </button>

  </nav>

</aside>


<!-- =====================================================
     Main
     ===================================================== -->

<main class="admin-main">


  <header class="admin-notice">

    <div>
      お知らせ
    </div>

    <span>
      生徒管理
    </span>

  </header>


  <section class="admin-content">


    <!-- =================================================
         Heading
         ================================================= -->

    <div class="page-heading">

      <div>

        <h1>
          生徒管理
        </h1>

        <p>
          生徒の登録と管理
        </p>

      </div>


      <button
        id="showForm"
        type="button"
        class="primary-button">

        生徒を追加

      </button>

    </div>


    <!-- =================================================
         Create
         ================================================= -->

    <section
      id="formCard"
      class="admin-card hidden">


      <h2>
        生徒を追加
      </h2>


      <label>

        氏名

        <input
          id="displayName"
          type="text"
          autocomplete="name"
          maxlength="100">

      </label>


      <label>

        メールアドレス

        <input
          id="email"
          type="email"
          autocomplete="email">

      </label>


      <label>

        初期パスワード

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128">

      </label>


      <div class="toolbar">


        <button
          id="create"
          type="button"
          class="primary-button">

          登録

        </button>


        <button
          id="cancel"
          type="button"
          class="secondary-button">

          キャンセル

        </button>


      </div>


      <p
        id="message"
        class="message"
        aria-live="polite">
      </p>


    </section>


    <!-- =================================================
         Student list
         ================================================= -->

    <section class="admin-card">


      <div
        style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:20px;
          margin-bottom:18px;
        ">


        <div>

          <h2
            style="
              margin:0;
            ">

            登録済み生徒

          </h2>


          <p
            style="
              margin:6px 0 0;
              color:#777;
              font-size:12px;
            ">

            現在登録されている生徒を表示します。

          </p>

        </div>


      </div>


      <div
        id="students"
        class="student-list"
        aria-live="polite"
        aria-busy="true">


        <div class="list-row">

          生徒を読み込んでいます。

        </div>


      </div>


    </section>


  </section>


</main>


<!-- =====================================================
     Script
     ===================================================== -->

<script
  type="module"
  src="app.js?v=student-detail-final-20261114-3">
</script>


</body>

</html>
