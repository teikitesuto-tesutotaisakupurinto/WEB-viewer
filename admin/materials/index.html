<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料配信</title>
<link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>

<header class="topbar">
<button class="menu-button" onclick="location.href='../'">戻る</button>
<div class="logo">資料配信</div>
</header>

<main class="page">

<h1>資料配信</h1>

<section class="card">

<h2>資料を追加</h2>

<label>
タイトル
<input id="title" type="text">
</label>

<label>
説明
<textarea id="description"></textarea>
</label>

<label>
ファイル
<input
  id="file"
  type="file"
  accept=".pdf,.jpg,.jpeg,.png">
</label>

<label>
対象
<select id="target">
<option value="all">全Student</option>
<option value="students">指定Student</option>
</select>
</label>

<label id="studentBox" class="hidden">
Student UID
<input
  id="studentIds"
  type="text"
  placeholder="複数の場合はカンマ区切り">
</label>

<button
  id="create"
  class="primary-button">
配信
</button>

<p id="message"></p>

</section>

<section class="card">

<h2>配信済み資料</h2>

<div id="materials"></div>

</section>

</main>

<script type="module" src="app.js"></script>

</body>
</html>
