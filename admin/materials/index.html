<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料配信</title>

<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<aside class="admin-side">

<div class="admin-brand">
<div>WEB-viewer</div>
<small>管理システム</small>
</div>

<nav>

<a href="../">ダッシュボード</a>
<a href="../books/">Book管理</a>
<a href="../serials/">シリアル管理</a>
<a href="../students/">Student管理</a>
<a class="active" href="./">資料配信</a>
<a href="../b4/">B4資料</a>
<a href="../system/">システム管理</a>

<button id="logout" type="button">
ログアウト
</button>

</nav>

</aside>


<main class="admin-main">

<header class="admin-notice">
<div>お知らせ</div>
<span>資料配信</span>
</header>


<section class="admin-content">

<div class="page-heading">

<div>
<h1>資料配信</h1>
<p>Studentへ資料を配信します。</p>
</div>

</div>


<section class="admin-card">

<h2>資料を追加</h2>

<label>
タイトル
<input id="title" type="text">
</label>

<label>
説明
<textarea id="description"></textarea>
</label>

<label>
ファイル
<input
  id="file"
  type="file"
  accept=".pdf,.jpg,.jpeg,.png">
</label>

<label>
対象
<select id="target">
<option value="all">全Student</option>
<option value="selected">Studentを選択</option>
</select>
</label>


<div
  id="studentArea"
  class="hidden">

<label>
<input
  id="selectAll"
  type="checkbox">
全Studentを選択
</label>

<div id="students"></div>

</div>


<button
  id="create"
  class="primary-button"
  type="button">
配信
</button>

<p id="message"></p>

</section>


<section class="admin-card">

<h2>配信済み資料</h2>

<div id="materials">
読み込み中です。
</div>

</section>

</section>

</main>


<script
  type="module"
  src="app.js">
</script>

</body>
</html>
