
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>資料配信</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

<link
  rel="stylesheet"
  href="../style.css">

</head>

<body>

<aside class="admin-side">

<div class="admin-brand">

<div>WEB-viewer</div>

<small>管理システム</small>

</div>


<nav>

<a href="../">
ダッシュボード
</a>

<a href="../books/">
Book管理
</a>

<a href="../serials/">
シリアル管理
</a>

<a href="../students/">
生徒管理
</a>

<a
  class="active"
  href="./">
資料配信
</a>

<a href="../b4/">
B4資料
</a>

<a href="../system/">
システム管理
</a>

<button
  id="logout"
  type="button">
ログアウト
</button>

</nav>

</aside>


<main class="admin-main">

<header class="admin-notice">

<div>お知らせ</div>

<span>資料配信</span>

</header>


<section class="admin-content">

<div class="page-heading">

<div>

<h1>
資料配信
</h1>

<p>
生徒へ資料を配信します
</p>

</div>

</div>


<section class="admin-card">

<h2>
資料を配信
</h2>


<label>

タイトル

<input
  id="title"
  type="text">

</label>


<label>

説明

<textarea
  id="description">
</textarea>

</label>


<label>

ファイル

<input
  id="file"
  type="file"
  accept=".pdf,.jpg,.jpeg,.png">

</label>


<label>

配信対象

<select id="target">

<option value="all">
全生徒
</option>

<option value="selected">
指定した生徒
</option>

</select>

</label>


<div
  id="studentArea"
  class="hidden">

<label
  class="student-row">

<input
  id="selectAll"
  type="checkbox">

<span>
全生徒を選択
</span>

</label>


<div
  id="students"
  class="student-list">
</div>

</div>


<div class="toolbar">

<button
  id="create"
  type="button"
  class="primary-button">

配信

</button>

</div>


<p
  id="message"
  class="message">
</p>

</section>


<section class="admin-card">

<h2>
配信済み資料
</h2>


<div
  id="materials">

<div class="list-row">
読み込んでいます。
</div>

</div>

</section>

</section>

</main>


<script
  type="module"
  src="app.js?v=admin-materials-final">
</script>

</body>

</html>
