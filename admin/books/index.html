<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book管理</title>
<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
<button class="menu-button" onclick="location.href='../'">戻る</button>
<div class="logo">Book管理</div>
</header>

<main class="page">

<div class="page-header">
  <div>
    <h1>Book管理</h1>
    <p>教材の登録と管理</p>
  </div>

  <button id="showForm" class="primary-button">
    Bookを追加
  </button>
</div>

<section id="formCard" class="card hidden">

<h2>Bookを追加</h2>

<label>
Book名
<input id="title" type="text">
</label>

<label>
説明
<textarea id="description"></textarea>
</label>

<label>
教材ファイル
<input
  id="files"
  type="file"
  accept=".pdf,.jpg,.jpeg,.png"
  multiple>
</label>

<p class="form-help">
PDFは1ファイル、画像は複数ファイルをページとして登録できます。
</p>

<div class="toolbar">

<button id="create" class="primary-button">
登録
</button>

<button id="cancel" class="secondary-button">
キャンセル
</button>

</div>

<p id="message" class="message"></p>

</section>

<section class="card book-list-card">

<h2>登録済みBook</h2>

<div id="books"></div>

</section>

</main>

<script type="module" src="app.js"></script>

</body>
</html>
