
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>Book管理</title>

<link
  rel="stylesheet"
  href="../../assets/css/common.css">

<link
  rel="stylesheet"
  href="../style.css">

<link
  rel="stylesheet"
  href="style.css">

</head>

<body>

<aside class="admin-side">

  <div class="admin-brand">

    <div>
      WEB-viewer
    </div>

    <small>
      管理システム
    </small>

  </div>


  <nav>

    <a href="../">
      ダッシュボード
    </a>

    <a
      href="./"
      class="active">
      Book管理
    </a>

    <a href="../serials/">
      シリアル管理
    </a>

    <a href="../students/">
      生徒管理
    </a>

    <a href="../materials/">
      資料配信
    </a>

    <a href="../b4/">
      B4資料
    </a>

    <a href="../system/">
      システム管理
    </a>

    <button
      id="logout"
      type="button">
      ログアウト
    </button>

  </nav>

</aside>


<main class="admin-main">

  <header class="admin-notice">

    <div>
      お知らせ
    </div>

    <span>
      Book管理
    </span>

  </header>


  <section class="admin-content">

    <div class="page-heading">

      <div>

        <h1>
          Book管理
        </h1>

        <p>
          PDFまたは複数画像から教材を登録します。
        </p>

      </div>


      <button
        id="showForm"
        type="button"
        class="primary-button">

        Bookを追加

      </button>

    </div>


    <section
      id="formCard"
      class="admin-card hidden">

      <h2>
        Bookを追加
      </h2>


      <label>

        Book名

        <input
          id="title"
          type="text"
          autocomplete="off">

      </label>


      <label>

        説明

        <textarea
          id="description"></textarea>

      </label>


      <label>

        教材ファイル

        <input
          id="files"
          type="file"
          accept=".pdf,.jpg,.jpeg,.png"
          multiple>

      </label>


      <p class="form-help">

        PDFは1ファイルで登録します。

        <br>

        JPG・JPEG・PNGは複数選択でき、
        選択した順番がページ順になります。

        <br>

        PDFと画像は同時に登録できません。

      </p>


      <div
        id="filePreview"
        class="file-preview">
      </div>


      <div class="toolbar">

        <button
          id="create"
          type="button"
          class="primary-button">

          登録

        </button>


        <button
          id="cancel"
          type="button"
          class="secondary-button">

          キャンセル

        </button>

      </div>


      <p
        id="message"
        class="message">
      </p>

    </section>


    <section class="admin-card">

      <div class="section-heading">

        <div>

          <h2>
            登録済みBook
          </h2>

          <p>
            PDFと画像教材
          </p>

        </div>

      </div>


      <div
        id="books"
        class="book-admin-list">

        <div class="book-empty">
          読み込んでいます。
        </div>

      </div>

    </section>

  </section>

</main>


<script
  type="module"
  src="app.js?v=book-final-20261112">
</script>

</body>

</html>
